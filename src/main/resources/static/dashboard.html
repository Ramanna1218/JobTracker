<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Match Review</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262a37;
    --text: #e6e8ef;
    --muted: #8b91a3;
    --accent: #5b8cff;
    --good: #3ecf8e;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .title { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .company { color: var(--muted); font-size: 14px; }
  .score {
    flex-shrink: 0;
    font-weight: 700;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(91,140,255,0.15);
    color: var(--accent);
    white-space: nowrap;
  }
  .meta { color: var(--muted); font-size: 13px; margin: 8px 0 14px; }
  .bullets { font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: var(--text); margin-bottom: 16px; }
  .actions { display: flex; gap: 10px; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .approve { background: var(--good); color: #06281a; }
  .approve:hover { opacity: 0.9; }
  .reject { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .reject:hover { background: rgba(255,92,92,0.1); }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .loading { color: var(--muted); text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job Match Review</h1>
  <div class="sub" id="subtitle">Loading...</div>
  <div id="list"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const userId = params.get('userId') || '1';

  async function loadMatches() {
    const listEl = document.getElementById('list');
    const subEl = document.getElementById('subtitle');
    listEl.innerHTML = '<div class="loading">Loading matches...</div>';

    try {
      const res = await fetch(`/api/users/${userId}/matches/pending`);
      const matches = await res.json();

      if (matches.length === 0) {
        subEl.textContent = 'No pending matches right now.';
        listEl.innerHTML = '<div class="empty">Nothing waiting for review. Run the search again to check for new postings.</div>';
        return;
      }

      subEl.textContent = `${matches.length} match(es) waiting for your review, sorted by best fit.`;
      listEl.innerHTML = matches.map(renderCard).join('');
    } catch (e) {
      subEl.textContent = 'Could not load matches. Is the app running?';
      listEl.innerHTML = '';
    }
  }

  function renderCard(m) {
    return `
      <div class="card" id="card-${m.id}">
        <div class="card-top">
          <div>
            <p class="title">${escapeHtml(m.title)}</p>
            <p class="company">${escapeHtml(m.company)} · ${escapeHtml(m.location || '')}</p>
          </div>
          <div class="score">${m.matchScore}/100</div>
        </div>
        <div class="meta">Source: ${escapeHtml(m.source || 'Unknown')}</div>
        <div class="bullets">${escapeHtml(m.tailoredBullets || 'No tailored bullets generated.')}</div>
        <div class="actions">
          <button class="approve" onclick="approve(${m.id}, '${encodeURIComponent(m.applyUrl || '')}')">Approve &amp; Open Apply Page</button>
          <button class="reject" onclick="reject(${m.id})">Dismiss</button>
        </div>
      </div>
    `;
  }

  async function approve(id, encodedUrl) {
    await fetch(`/api/matches/${id}/approve`, { method: 'POST' });
    const url = decodeURIComponent(encodedUrl);
    if (url) window.open(url, '_blank');
    document.getElementById(`card-${id}`).remove();
  }

  async function reject(id) {
    await fetch(`/api/matches/${id}/reject`, { method: 'POST' });
    document.getElementById(`card-${id}`).remove();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  loadMatches();
</script>
</body>
</html>
